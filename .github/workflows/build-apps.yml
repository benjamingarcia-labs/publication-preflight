name: Build Private Test Applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.3
      - name: Build executable
        run: python build.py
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/PublicationPreflight.exe -DestinationPath PublicationPreflight-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: PublicationPreflight-Windows
          path: PublicationPreflight-Windows.zip
          retention-days: 7

  macos:
    name: macOS application
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.3
      - name: Build app bundle
        run: python build.py
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/PublicationPreflight.app PublicationPreflight-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: PublicationPreflight-macOS
          path: PublicationPreflight-macOS.zip
          retention-days: 7
